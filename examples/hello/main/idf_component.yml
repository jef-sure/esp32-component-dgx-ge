## IDF Component Manager Manifest File: the engine, and what the boards need beyond it
dependencies:
  jef-sure/dgx-ge:
    version: "*"
    # the engine this example lies in; an example made from the registry takes the registry's
    override_path: "../../../"
  # the touch of a board: its fingers as fingers of the display, the pad and the keyboard on the display
  jef-sure/dgx-di: "^0.1.1"
  # the P4 boards' sound, an ES8311
  espressif/esp_codec_dev:
    version: "~1.6.2"
    rules:
      - if: "target == esp32p4"
  # the 7"'s touch panel, a GT911
  espressif/esp_lcd_touch_gt911:
    version: "^1"
    rules:
      - if: "target == esp32p4"
