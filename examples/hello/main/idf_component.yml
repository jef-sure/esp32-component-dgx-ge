## IDF Component Manager Manifest File: the engine and the boards
dependencies:
  # the registry's; inside the engine's tree, the engine itself, a component of the project (CMakeLists.txt), takes
  # its place
  jef-sure/dgx-ge:
    version: "*"
  # the hardware: the display, the touch, the sound of the board the build chose (sdkconfig.defaults.<board>); it
  # brings what that board needs (DGX-DI for a touch, the drivers of its sound) and nothing else
  jef-sure/boards: ">=0.0.5"
